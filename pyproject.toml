[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "/(\\.git|\\.venv|venv)/"

[tool.isort]
profile = "black"
line_length = 88
known_odoo = ["odoo"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "ODOO", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pylint.master]
load-plugins = ["pylint_odoo"]

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116"]
